# Vertical module: single- or multi-location service business (salon, clinic, restaurant, trades)
label: Local business
required_schema:
  - [LocalBusiness, HairSalon, BeautySalon, HealthAndBeautyBusiness, DaySpa, NailSalon, Restaurant, Store, ProfessionalService, MedicalBusiness, HomeAndConstructionBusiness]
schema_props: [address, telephone, openingHoursSpecification, geo, sameAs]
expected_pages:            # a page whose URL or nav text matches any pattern
  prices: ["price", "pricing", "menu", "rates"]
  services: ["service", "treatment", "balayage", "colour", "cut"]
  contact: ["contact", "find-us", "location"]
  about/team: ["about", "team", "stylist", "our-story"]
directories:               # used by soe_citations.py
  core: [Google Business Profile, Bing Places, Apple Business Connect, Facebook, Instagram]
  uk_general: [Yell, Thomson Local, Scoot, Cylex, FreeIndex, Hotfrog, Yelp UK, Nextdoor, Foursquare]
  vertical_salon: [Treatwell, Fresha, Booksy, hairdressr]
  local: [Business Improvement District site, local council directory]
