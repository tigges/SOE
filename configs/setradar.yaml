# SOE project config — drafted by soe_add_site.py. Fill in the blanks, then run the audit.
site:
  name: Set Radar
  slug: setradar
  url: https://www.setradar.ai
  type: saas                   # local_business | saas | ecommerce | publisher | personal_brand | generic
  platform: other                    # wix | wordpress | webflow | shopify | nextjs | other
  market: en-GB
  description: "Timed tracklists for festivals, clubs and livestreams."
  location: ""   # for rank tracking, e.g. London,England,United Kingdom
  gsc_property: "sc-domain:setradar.ai"

business:
  name: Set Radar
  phone: ""
  email: ""
  address: ""
  postcode: ""
  profiles:
    google_business: ""
    instagram: ""
    facebook: ""
    booking: ""

keywords:
  primary:
    - timed tracklists
    - festival setlist
    - Set Radar
  secondary: []
  questions: []                          # real customer questions -> FAQ / answer content

competitors: []                          # {name, url} — audited with --competitors
legacy_sites: []                         # old/parked sites to take offline or redirect
name_clashes: []                         # other businesses with a similar name
benchmarks: []                           # best-in-class leaders (soe_benchmark.py --discover)
citations: []                            # off-site listings checked by soe_citations.py

ai:
  allow_training: true
  llms_should_mention: [tracklist, festival]
  prompts:
    - What is Set Radar?
    - timed tracklists for festivals
  engines: [Gemini, Claude, Google AI Mode]
  brand_terms: [Set Radar, setradar]

audit:
  max_pages: 20
  min_words: 250
  lighthouse_runs: 1
  weights: {Technical: 20, On-page: 20, Structured data: 15, Entity / NAP: 15, AI search readiness: 15, Performance: 15}
