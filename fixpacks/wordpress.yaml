platform: WordPress (Yoast / Rank Math, Elementor)
fixes:
  title: &yoast "Edit page → Yoast SEO (or Rank Math) panel → SEO title. Site-wide templates are under Yoast → Settings → Content types."
  title-length: *yoast
  title-quality: *yoast
  duplicate-title: *yoast
  keyword-targeting: "Set the focus keyphrase in Yoast/Rank Math, and use it in the SEO title and the Elementor heading widget (HTML tag H1)."
  meta-description: "Yoast/Rank Math panel → Meta description."
  h1: "Elementor Heading widget → Content → HTML Tag = H1. Make sure the theme isn't also printing the page title as an H1 (Elementor → Page settings → Hide title)."
  canonical: "Yoast → Advanced → Canonical URL."
  noindex: "Yoast → Advanced → Allow search engines to show this page = Yes. Also check Settings → Reading → 'Discourage search engines' is off."
  thin-content: "Add sections in Elementor; Yoast readability/word count helps."
  alt-text: "Media Library → image → Alternative Text."
  og-image: "Yoast → Social → Facebook image (1200×630). A site default is in Yoast → Settings → Site basics."
  content-in-pdf: "Rebuild it as an HTML price/services section (Elementor Price List widget)."
  schema-missing: &wpschema "Yoast/Rank Math → Settings → Site representation (Organisation / Local business). For a salon: Rank Math Local SEO module or the Yoast Local SEO add-on sets the LocalBusiness subtype, hours and geo. Otherwise paste JSON-LD with a code-snippets plugin (WPCode)."
  schema-openingHoursSpecification: *wpschema
  schema-geo: *wpschema
  schema-sameAs: "Yoast → Settings → Site representation → Other profiles."
  schema-address: *wpschema
  schema-telephone: *wpschema
  llms.txt: "Yoast (v25+) and Rank Math can generate llms.txt, or upload a file to the web root via SFTP (Cloudways → Application → Access details)."
  llms.txt-summary: "Edit the llms.txt summary in the plugin or in the file."
  robots.txt: "Yoast → Tools → File editor, or upload robots.txt to the web root."
  ai-search-bots-blocked: "Check robots.txt, then the Cloudflare → Security → Bots / 'Block AI bots' setting, then any WAF plugin. Allow the search-type bots."
  broken-page: "Redirection plugin (or Rank Math → Redirections) → add a 301."
  host-canonicalisation: "Settings → General (WordPress Address + Site Address), plus Cloudways → Domain Management → primary domain and force-HTTPS."
  sitemap: "Yoast → Settings → Site features → XML sitemaps on. Submit /sitemap_index.xml in Search Console and Bing."
  expected-page: "Pages → Add New (Elementor), then add it to Appearance → Menus."
  lcp: "Cloudways: turn on Breeze or Varnish, Object Cache Pro and the Cloudflare Enterprise add-on. Serve the hero as WebP with fetchpriority=high (Elementor → Image → optimise). Remove unused Elementor widgets (Elementor → Features → Improved asset loading)."
  tbt-inp-proxy: "Defer JS (WP Rocket, Perfmatters or Breeze) and remove unused plugins, sliders and third-party chat widgets."
  cls: "Set image dimensions and reserve space for embeds; turn on Elementor 'Optimized DOM output'."
  brand-name: "Settings → General → Site Title, plus Yoast → Site representation → Organisation name."
  nap-phone: "Put the phone in the footer template (Elementor Theme Builder → Footer)."
  nap-postcode: "Put the full address in the footer template."
  answer-content: "Add an FAQ section (Elementor Accordion). It's visible text for AI answers; FAQ rich results no longer show."
  indexnow: "Install the IndexNow plugin (Microsoft) or the Rank Math Instant Indexing module."
  placeholder-text: "Search the Elementor templates and pages for the demo text and replace it with real copy."
