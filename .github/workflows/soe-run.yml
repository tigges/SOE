name: SOE run
# Manual only: GitHub → Actions → SOE run → Run workflow (also works from the GitHub mobile app).
# To schedule it again later, add:  schedule: [{ cron: "0 6 1 * *" }]
on:
  workflow_dispatch:
    inputs:
      site:
        description: "Which site? 'all' or a settings-file name, e.g. yuzu or djurbant"
        default: all
        type: string
      lighthouse:
        description: "Speed test (adds ~3 min per site)"
        default: true
        type: boolean
      competitors:
        description: "Audit competitors"
        default: true
        type: boolean
      benchmark:
        description: "Benchmark against leaders (adds ~3 min per site)"
        default: true
        type: boolean
jobs:
  soe:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env:
      PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
      CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ github.workspace }}/.secrets/gsc.json
      DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
      DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
      GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
      GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
      GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install requests beautifulsoup4 lxml pyyaml google-auth
      - name: Write Search Console key (if set)
        run: |
          mkdir -p .secrets
          if [ -n "${{ secrets.GSC_SERVICE_ACCOUNT_B64 }}" ]; then echo "${{ secrets.GSC_SERVICE_ACCOUNT_B64 }}" | base64 -d > .secrets/gsc.json; else echo "GSC_SERVICE_ACCOUNT_JSON=" >> "$GITHUB_ENV"; fi
      - name: Run the SOE loop for every site
        run: |
          D=$(date +%F)
          SITE="${{ inputs.site }}"
          FLAGS="--integrations"
          [ "${{ inputs.lighthouse }}" = "true" ] && FLAGS="$FLAGS --lighthouse"
          [ "${{ inputs.competitors }}" = "true" ] && FLAGS="$FLAGS --competitors"
          for c in configs/*.yaml; do
            slug=$(basename "$c" .yaml)
            [ "$slug" = "_template" ] && continue
            [ -n "$SITE" ] && [ "$SITE" != "all" ] && [ "$SITE" != "$slug" ] && continue
            out="reports/$slug/$D"
            echo "::group::$slug"
            python soe_audit.py "$c" --out "$out" $FLAGS || { echo "::endgroup::"; continue; }
            python soe_citations.py "$c" --out "$out" || true
            python soe_ai_log.py init "$c"; python soe_ai_log.py run "$c" || true
            python soe_ai_log.py summary "$c" --out "$out" > /dev/null || true
            copy="projects/$slug/copy.yaml"
            [ "${{ inputs.benchmark }}" = "true" ] && { python soe_benchmark.py "$c" --out "$out" || true; }
            python soe_fixes.py "$c" "$out" $( [ -f "$copy" ] && echo --copy "$copy" ) $( [ -n "$ANTHROPIC_API_KEY" ] && echo --llm ) || true
            echo "::endgroup::"
          done
          python soe_dashboard.py
          python soe_dashboard.py --standalone --out index.html
      - name: Commit reports and dashboard
        run: |
          git config user.name "soe-bot"; git config user.email "soe-bot@users.noreply.github.com"
          git add reports data dashboard/dist index.html && git commit -m "SOE run $(date +%F) (${{ inputs.site }})" || echo "no changes"
          git push
      # GitHub Pages republishes index.html automatically. The Claude dashboard updates when /soe runs in a session.
